name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version: ['27.1', '28.2', '29.4']
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            silex/emacs:${{ matrix.emacs-version }} \
            emacs -Q --batch -l blast-test.el -f ert-run-tests-batch-and-exit
